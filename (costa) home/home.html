<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Costa Confecções</title>
  <link rel="stylesheet" href="CSS/home.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>
  <header>

    <div class="logo-1">
      <div class="logo-costa">
        <img src="CSS/Logo-Costa Confecções.jpeg" alt="Logo Costa Confecções">
      </div>
    </div>

    <div class="header-centro">
      <input id="campo-pesquisa" type="text" placeholder="Pesquisar produtos...">
      <button id="botao-pesquisa">
        <i class="fa-solid fa-magnifying-glass"></i>
      </button>
    </div>

    <div class="header-direita">

      <button class="caixa-menor" id="botao-favoritos">
        <i class="fa-solid fa-heart"></i>
        <span>Lista de Desejos</span>
      </button>

      <button class="caixa-menor" id="botao-login">
        <i class="fa-regular fa-circle-user"></i>
        <span>Login</span>
      </button>

    </div>

  </header>



  <section class="roupas" id="banner-principal">
    <div class="destaque">
      <img src="CSS/roupas.jpg" alt="roupas penduradas">
      <div class="titulo-secao">roupas de todos os precos possiveis</div>
    </div>
  </section>


  <div class="anuncio">Anúncio</div>

  <section class="categorias">
    <div class="card" id="categoria-masculino">
      <img src="CSS/modelo masculino.jpg" alt="modelo masculino sentado" />
      <span>Masculino</span>
    </div>

    <div class="card" id="categoria-feminino">
      <img src="CSS/modelo feminino.jpg" alt="modelo feminino em pe no meio de uma praça" />
      <span>Feminino</span>
    </div>
  </section>

  <section class="destaque" id="banner-destaques">
    <img src="CSS/destaques.jpg" alt="varias roupas penduradas em filas" />

    <div class="titulo-secao">Destaques</div>
  </section>

  <section class="filtro" id="banner-filtro">
    <img src="CSS/filtro.jpg" alt="Filtro" />

    <div class="titulo-secao">Filtro</div>
  </section>

  <!--RODA PÉ-->
  <footer>

    <div class="footer-coluna logo-footer">
      <p>Contato</p>

      <div class="redes-sociais">
        <i class="fa-brands fa-instagram"></i>
        <i class="fa-brands fa-whatsapp"></i>
      </div>

    </div>

    <div class="divisor"></div>

    <div class="footer-coluna">
      <p>Sobre</p>
      <i class="fa-regular fa-circle-question footer-icon"></i>
    </div>

    <div class="divisor"></div>

    <div class="footer-coluna">
      <p>Suporte</p>
      <i class="fa-solid fa-headset footer-icon"></i>
    </div>

    <div class="divisor"></div>

    <div class="footer-coluna2">
      <p>Sustentabilidade</p>
      <p>Mapa do site</p>
      <p>Clique e retire</p>
    </div>

    <div class="divisor"></div>

    <div class="footer-coluna2">
      <p>Política de privacidade</p>
      <p>Termos e condições</p>
    </div>

    <div class="divisor"></div>

    <div class="footer-coluna">
      <img
        src="https://cdn.prod.website-files.com/686fd3c4baa0f126615c68cc/68756d11ab44b920e1451861_logo-aplica%C3%A7%C3%A3o-site.svg"
        alt="Site Blindado">
    </div>

  </footer>

  <div class="direitos">
    © Class 238 - Todos os direitos
  </div>

  <script src="js/home.js"></script>
</body>

</html>
