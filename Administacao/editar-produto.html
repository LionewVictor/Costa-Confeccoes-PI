<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Editar Produto | Costa Confecções</title>

    <link rel="stylesheet" href="CSS/editar-produto.css" />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.1/css/all.min.css"
    />
  </head>

  <body>
    <!-- ======================== -->
    <!-- MENU LATERAL -->
    <!-- ======================== -->

    <aside class="sidebar">
      <div class="logo">
        <img
          src="../Global/CSS/Logo - Costa Confeccoes.jpeg"
          alt="Costa Confecções"
        />
      </div>

      <nav>
        <ul>
          <li id="menu-dashboard">
            <i class="fa-solid fa-chart-line"></i>

            Dashboard
          </li>

          <li id="menu-produtos">
            <i class="fa-solid fa-box"></i>

            Produtos
          </li>

          <li id="menu-cadastrar">
            <i class="fa-solid fa-square-plus"></i>

            Cadastrar Produto
          </li>

          <li class="ativo">
            <i class="fa-solid fa-pen-to-square"></i>

            Editar Produto
          </li>

          <li id="menu-ver-site">
            <i class="fa-solid fa-globe"></i>

            Ver Site
          </li>

          <li id="menu-sair">
            <i class="fa-solid fa-right-from-bracket"></i>

            Sair
          </li>
        </ul>
      </nav>
    </aside>

    <!-- ======================== -->
    <!-- CONTEÚDO -->
    <!-- ======================== -->

    <main class="conteudo">
      <header class="topo">
        <h1>Editar Produto</h1>

        <p>Atualize as informações do produto.</p>
      </header>

      <form id="form-editar-produto">
        <div class="grid">
          <div class="campo">
            <label for="nome"> Nome </label>

            <input type="text" id="nome" required />
          </div>

          <div class="campo">
            <label for="marca"> Marca </label>

            <input type="text" id="marca" required />
          </div>

          <div class="campo">
            <label for="categoria"> Categoria </label>

            <select id="categoria">
              <option>Camisetas</option>
              <option>Calças</option>
              <option>Bermudas</option>
              <option>Bonés</option>
              <option>Acessórios</option>
            </select>
          </div>

          <div class="campo">
            <label for="genero"> Gênero </label>

            <select id="genero">
              <option>Masculino</option>
              <option>Feminino</option>
              <option>Infantil</option>
            </select>
          </div>

          <div class="campo">
            <label for="preco"> Preço </label>

            <input type="number" step="0.01" id="preco" required />
          </div>

          <div class="campo">
            <label for="tamanho"> Tamanho </label>

            <select id="tamanho">
              <option>PP</option>
              <option>P</option>
              <option>M</option>
              <option>G</option>
              <option>GG</option>
              <option>Único</option>
            </select>
          </div>

          <div class="campo">
            <label for="cor"> Cor </label>

            <input type="text" id="cor" />
          </div>

          <div class="campo">
            <label for="material"> Material </label>

            <input type="text" id="material" />
          </div>

          <div class="campo">
            <label for="imagem"> Nova Imagem (opcional) </label>

            <input type="file" id="imagem" accept="image/*" />
          </div>
        </div>

        <div class="campo">
          <label for="descricao"> Descrição </label>

          <textarea id="descricao" rows="6"></textarea>
        </div>

        <div class="botoes">
          <button type="button" class="cancelar" id="cancelar">Cancelar</button>

          <button type="submit" class="salvar">Atualizar Produto</button>
        </div>
      </form>
    </main>

    <script src="js/admin.js"></script>
    <script src="js/editar-produto.js"></script>
  </body>
</html>
