<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Desejos - Costa Confecções</title>
    <link rel="stylesheet" href="favoritos.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
    <body> 
  <header>

        <div class="logo-1">
            <div class="logo-costa">
                <img src="WhatsApp Image 2026-06-19 at 14.49.27.jpeg" alt="Logo Costa Confecções">
            </div>
        </div>

        <div class="header-centro">
            <input type="text">
            <button>
                <i class="fa-solid fa-magnifying-glass"></i>
            </button>
        </div>

        <div class="header-direita">

            <button class="caixa-menor">
                <i class="fa-solid fa-heart"></i>
                <span>Lista de Desejos</span>
            </button>

            <button class="caixa-menor">
                <i class="fa-regular fa-circle-user"></i>
                <span>Login</span>
            </button>

        </div>

    </header>

        <main class="main-container">
                                                                                                                                                                                                                                
            <section class="top-section">
                <div class="favorites-title">
                    Favoritos <span class="star-icon">★</span>
                </div>
                <div class="ad-banner">
                    Anúncio
                </div>
            </section>

            <section class="filters-section">
                <label class="filter-item">
                    <input type="checkbox"> Maior Preço
                </label>
                <label class="filter-item">
                    <input type="checkbox"> Maior Tamanho
                </label>
                <label class="filter-item">
                    <input type="checkbox"> Maior Tamanho
                </label>
                <label class="filter-item">
                    <input type="checkbox"> Menor Tamanho
                </label>
            </section>

            <section class="products-list">
                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                    
                <div class="product-card">
                    <div class="product-img-container">
                        <img src="https://via.placeholder.com/120x120?text=Calca" alt="Calça Jeans" class="product-image">
                    </div>
                    <div class="product-info">
                        <h3 class="product-name">Calça Jeans Masculina Zigurat</h3>
                        <p class="product-price">R$99,99</p>
                    </div>
                        <button class="delete-btn">
                            Excluir <i class="fa-regular fa-trash-can"></i>
                        </button>
                </div>

                <div class="product-card">
                    <div class="product-img-container">
                        <img src="https://via.placeholder.com/120x120?text=Camisa" alt="Camisa Masculina" class="product-image">
                    </div>
                    <div class="product-info">
                        <h3 class="product-name">Camisa Masculina Ogochi</h3>
                        <p class="product-price">R$64,99</p>
                    </div>
                    <button class="delete-btn">
                        Excluir <i class="fa-regular fa-trash-can"></i>
                    </button>
                </div>

                <div class="product-card">
                    <div class="product-img-container">
                        <img src="https://via.placeholder.com/120x120?text=Cinto" alt="Cinto de Couro" class="product-image">
                    </div>
                        <div class="product-info">
                            <h3 class="product-name">Cinto de Couro</h3>
                            <p class="product-price">R$14,99</p>
                        </div>
                        <button class="delete-btn">
                            Excluir <i class="fa-regular fa-trash-can"></i>
                        </button>
                </div>

            </section>
        </main>
<footer>

    <div class="footer-coluna logo-footer">     
    <p>Contato</p>

        <div class="redes-sociais">
            <i class="fa-brands fa-instagram"></i>
            <i class="fa-brands fa-whatsapp"></i>
        </div>

    </div>

    <div class="divisor"></div>

    <div class="footer-coluna">
        <p>Sobre</p>
        <i class="fa-regular fa-circle-question footer-icon"></i>
    </div>

    <div class="divisor"></div>

    <div class="footer-coluna">
        <p>Suporte</p>
        <i class="fa-solid fa-headset footer-icon"></i>
    </div>

    <div class="divisor"></div>

    <div class="footer-coluna2">
        <p>Sustentabilidade</p>
        <p>Mapa do site</p>
        <p>Clique e retire</p>
    </div>

    <div class="divisor"></div>

    <div class="footer-coluna2">
        <p>Política de privacidade</p>
        <p>Termos e condições</p>
    </div>

    <div class="divisor"></div>

    <div class="footer-coluna">
        <img src="https://cdn.prod.website-files.com/686fd3c4baa0f126615c68cc/68756d11ab44b920e1451861_logo-aplica%C3%A7%C3%A3o-site.svg" alt="Site Blindado">
    </div>

</footer>

      <div class="direitos">
        © Class 238 - Todos os direitos
    </div>
     </body>
</html>
