<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Costa Confecções</title>
  <link rel="stylesheet" href="/Home/CSS/home.css">
  <link rel="stylesheet" href="/Global/CSS/global.css">
  <link rel="stylesheet" href="/Global/CSS/header.css">
  <link rel="stylesheet" href="/Global/CSS/footer.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>
  <header class="header">
  
    <div class="logo-1">
      <div class="logo-costa" id="logo">
        <img src="/Global/CSS/Logo - Costa Confeccoes.jpeg" alt="Logo Costa Confecções">
      </div>
    </div>
  
    <div class="header-centro">
      <input id="campo-pesquisa" type="text" placeholder="Pesquisar produtos...">
      <button id="botao-pesquisa">
        <i class="fa-solid fa-magnifying-glass"></i>
      </button>
    </div>
  
    <div class="header-direita">
  
      <button class="caixa-menor" id="botao-favoritos">
        <i class="fa-solid fa-heart"></i>
        <span>Lista de Desejos</span>
      </button>
  
      <button class="caixa-menor" id="botao-login">
        <i class="fa-regular fa-circle-user"></i>
        <span>Login</span>
      </button>
  
    </div>
  </header>

  <section class="roupas" id="banner-principal">
    <div class="destaque">
      <img src="/Home/CSS/roupas.jpg" alt="roupas penduradas">
      <div class="titulo-secao">Roupas de todos os preços disponíveis!</div>
    </div>
  </section>


  <div class="anuncio">Anúncio</div>

  <section class="categorias">
    <div class="card" id="categoria-masculino">
      <img src="/Home/CSS/modelo masculino.jpg" alt="modelo masculino sentado" />
      <span>Masculino</span>
    </div>

    <div class="card" id="categoria-feminino">
      <img src="/Home/CSS/modelo feminino.jpg" alt="modelo feminino em pe no meio de uma praça" />
      <span>Feminino</span>
    </div>
  </section>

  <section class="destaque" id="banner-destaques">
    <img src="/Home/CSS/destaques.jpg" alt="varias roupas penduradas em filas" />

    <div class="titulo-secao">Destaques</div>
  </section>

  <section class="filtro" id="banner-filtro">
    <img src="/Home/CSS/filtro.jpg" alt="Filtro" />

    <div class="titulo-secao">Filtro</div>
  </section>

  <!--RODA PÉ-->
  <footer class="footer">
    <div class="footer-coluna logo-footer">
      <p>Contato</p>
  
      <div class="redes-sociais">
        <div class="instagram" id="insta">
          <i class="fa-brands fa-instagram"></i>
        </div>
        <div class="whatsapp" id="zap">
          <i class="fa-brands fa-whatsapp"></i>
        </div>
      </div>
    </div>
  
    <div class="divisor"></div>
    <div class="footer-coluna">
      <p>Sobre</p>
      <div id="sobre" data-link="sobre.html">
        <i class="fa-regular fa-circle-question footer-icon"></i>
      </div>
    </div>
  
    <div class="divisor"></div>
    <div class="footer-coluna">
      <p>Suporte</p>
      <div id="suporte" data-link="central.html">
        <i class="fa-solid fa-headset footer-icon"></i>
      </div>
    </div>
  
    <div class="divisor"></div>
    <div class="footer-coluna2">
      <p id="sustentabilidade" data-link="sustentabilidade.html">
        Sustentabilidade
      </p>
  
      <p id="mapa-site" data-link="mapa-site.html">
        Mapa do Site
      </p>
  
    </div>
  
    <div class="divisor"></div>
    <div class="footer-coluna2">
      <p id="politica-privacidade" data-link="politica-privacidade.html">
        Política de Privacidade
      </p>
  
      <p id="termos-condicoes" data-link="termos-condicoes.html">
        Termos e Condições
      </p>
    </div>
  
    <div class="divisor"></div>
    <div class="footer-coluna">
      <img
        src="https://cdn.prod.website-files.com/686fd3c4baa0f126615c68cc/68756d11ab44b920e1451861_logo-aplica%C3%A7%C3%A3o-site.svg"
        alt="Site Blindado">
    </div>
  </footer>

  <div class="direitos">
    © Class 238 - Todos os direitos
  </div>

  <script src="/Global/js/header.js"></script>
  <script src="/Global/js/footer.js"></script>
  <script src="/Home/js/home.js"></script>
</body>

</html>
