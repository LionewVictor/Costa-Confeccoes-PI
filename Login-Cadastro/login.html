<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fazer Login</title>

    <link rel="stylesheet" href="login.css">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>

<div class="login-card">

    <h1>Fazer Login</h1>

    <p class="subtitle">
        Entrar na sua conta
    </p>

    <div class="social-login-container">

        <button type="button" class="social-btn" id="googlebutton">
            <i class="fab fa-google"></i>
            Google
        </button>

        <button type="button" class="social-btn" id="facebookbutton">
            <i class="fab fa-facebook-f"></i>
            Facebook
        </button>

    </div>

    <div class="divider-container">
        <div class="divider-line"></div>
        <span>ou</span>
        <div class="divider-line"></div>
    </div>

    <form id="loginForm">

        <div class="form-group">

            <label for="email">
                E-mail
            </label>

            <input
                type="email"
                id="email"
                class="input-field"
                placeholder="Digite seu e-mail"
                required>

        </div>

        <div class="form-group">

            <label for="senha">
                Senha
            </label>

            <input
                type="password"
                id="senha"
                class="input-field"
                placeholder="Digite sua senha"
                minlength="6"
                required>

        </div>

        <button
            type="submit"
            class="btn-submit"
            id="btn_continuar">

            ENTRAR

        </button>

        <div class="cadastro">
          Não tem uma conda <a href="cadastro.html">crie sua conta</a>
        </div>

    </form>

</div>

<script src="login.js"></script>

</body>

</html>
