<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Central de Ajuda - Costa Confecções</title>

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <link rel="stylesheet" href="https://cdn-uicons.flaticon.com/uicons-regular-rounded/css/uicons-regular-rounded.css">
    
</head>

<body>

    <header>

        <div class="logo-1">
            <div class="logo-costa">
                <img src="WhatsApp Image 2026-06-19 at 14.49.27.jpeg" alt="Logo Costa Confecções">
            </div>
        </div>

        <div class="header-centro">
            <input type="text">
            <button>
                <i class="fa-solid fa-magnifying-glass"></i>
            </button>
        </div>

        <div class="header-direita">

            <button class="caixa-menor" onclick="window.location.href='../Favoritos/favoritos.html'">
                <i class="fa-solid fa-heart"></i>
                <span>Lista de Desejos</span>
            </button>

            <button class="caixa-menor" onclick="window.location.href='../Login-costa/html/login.html'">
                <i class="fa-regular fa-circle-user"></i>
                <span>Login</span>
            </button>

        </div>

    </header>

    <main>

        <h1>Central de Ajuda Costa Confecções</h1>

        <div class="pesquisa">

            <i class="fa-solid fa-magnifying-glass"></i>

            <input type="text" placeholder="Digite aqui sua dúvida">

            <button>Pesquisar</button>

        </div>

        <section class="caixa-geral">

            <div class="caixa">
                <div class="caixa-icone">
                    <i class="fa-brands fa-whatsapp"></i>
                </div>
                <h4>Whatsapp</h4>
            </div>

            <div class="caixa">
                <div class="caixa-icone">
                    <i class="fa-solid fa-shirt"></i>
                </div>
                <h4>Produtos e Tamanhos</h4>
            </div>

            <div class="caixa">
                <div class="caixa-icone">
                    <i class="fa-solid fa-user-shield"></i>
                </div>
                <h4>Denunciar um Site ou Contato Suspeito</h4>
            </div>

            <div class="caixa">
                <div class="caixa-icone">
                    <i class="fa-brands fa-instagram"></i>
                </div>
                <h4>Instagram</h4>
            </div>

        </section>

    </main>

    <footer class="footer">

        <div class="footer-coluna logo-footer">

           
            <p>Contato</p>

            <div class="redes-sociais">
                <i class="fa-brands fa-instagram"></i>
                <i class="fa-brands fa-whatsapp"></i>
            </div>

        </div>

        <div class="divisor"></div>

        <div class="footer-coluna">
            <p>Sobre</p>
            <i class="fa-regular fa-circle-question footer-icon"></i>
        </div>

        <div class="divisor"></div>

        <div class="footer-coluna">
            <p>Suporte</p>
            <i class="fa-solid fa-headset footer-icon"></i>
        </div>

        <div class="divisor"></div>

        <div class="footer-coluna2">
            <p>Sustentabilidade</p>
            <p>Mapa do site</p>
            <p>Clique e retire</p>
        </div>

        <div class="divisor"></div>

        <div class="footer-coluna2">
            <p>Política de privacidade</p>
            <p>Termos e condições</p>
        </div>

        <div class="divisor"></div>

        <div class="footer-coluna">
            <img src="https://cdn.prod.website-files.com/686fd3c4baa0f126615c68cc/68756d11ab44b920e1451861_logo-aplica%C3%A7%C3%A3o-site.svg" alt="Site Blindado">
        </div>

    </footer>

    <div class="direitos">
        © Class 238 - Todos os direitos
    </div>

</body>
</html>
